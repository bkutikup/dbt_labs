version: 2

sources:
  - name: tele_customer
    schema: SF_SCHEMA
    database: SNOWFLAKE_DBT_DATE
    tables:
      - name: TELECOM_CUSTOMERS
        identifier: TELECOM_CUSTOMERS
        columns:
          - name: customer_id
            tests:
              - not_null:
                  severity: warn
              - unique
          - name: email
            tests:
              - not_null
          - name: mobile_number
            tests:
              - not_null
          - name: gender
            tests:
              - accepted_values:
                  values: ['Male', 'Female']
          - name: age
            tests:
              - not_null
              - value_between_range:
                  min_value: 18
                  max_value: 100
  - name: tele_telecom_plans
    schema: SF_SCHEMA
    database: SNOWFLAKE_DBT_DATE
    tables:
      - name: TELE_PLANS
        identifier: TELECOM_PLANS
        columns:
          - name: plan_id
            tests:
              - not_null
              - unique
          - name: customer_id
            tests:
              - not_null
              - relationships:
                  field: customer_id
                  to: source('tele_customer', 'TELECOM_CUSTOMERS')
          - name: plan_type
            tests:
              - accepted_values:
                  values: ['Prepaid', 'Postpaid']
          - name: price
            tests:
              - not_null
models:
  - name: customer_analysis
    description: "Customer information"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              field: customer_id
              to: source('tele_customer', 'TELECOM_CUSTOMERS')  # if any other model is there than use ref('model_name')
      - name: email
        tests:
          - not_null
          - valid_email_format
      - name: gender
        tests:
          - accepted_values:
              values: ['Male', 'Female']
      - name: age
        tests:
          - not_null
          - value_between_range:
              min_value: 18
              max_value: 100
    tests:
      - duplicate_check:
          column_names: ['EMAIL', 'FULL_NAME']